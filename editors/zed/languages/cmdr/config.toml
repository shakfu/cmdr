name = "cmdr"
grammar = "cmdr"
path_suffixes = ["cmdr"]
line_comments = ["# "]
tab_size = 2
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["raw_string"] },
]
